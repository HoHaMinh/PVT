<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Bắt buộc phải có cho Mobile -->
    <title>Đăng nhập web PVT</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap5.min.css}">
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            background: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="login-card">
                <div class="text-center mb-4">
                    <img src="https://www.hoaphat.com.vn/assets/images/logo.png" alt="Logo" style="max-height: 50px;">
                    <h3 class="text-primary mt-3">Đăng nhập PVT</h3>
                </div>

                <div th:if="${#request.getParameter('error') == 'true'}" class="alert alert-danger text-center" role="alert">
                    Sai account hoặc password!
                </div>

                <form th:action="@{/doLogin}" method="post">
                    <!-- Account input -->
                    <div class="mb-3 text-start">
    			<label class="form-label fw-bold" for="form2Example1">Account ID</label>
    			<input type="text" id="form2Example1" class="form-control form-control-lg" name="accountname" required placeholder="Nhập ID của bạn">
		    </div>

                    <!-- Password input -->
                    <div class="mb-3 text-start">
    			<label class="form-label fw-bold" for="form2Example2">Mật khẩu</label>
    			<input type="password" id="form2Example2" class="form-control form-control-lg" name="password" required placeholder="Nhập mật khẩu">
		    </div>

                    <!-- Submit button -->
                    <button type="submit" class="btn btn-primary btn-lg w-100">Đăng nhập</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/jquery4.min.js}"></script>
<script th:src="@{/js/bootstrap5.bundle.min.js}"></script>
</body>
</html>
