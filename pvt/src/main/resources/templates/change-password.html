<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - PVT</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap5.min.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        .password-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        .password-card-header {
            background-color: #05428c;
            color: white;
            border-radius: 12px 12px 0 0 !important;
        }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid p-0">
    <div th:replace="~{fragments :: header}"></div>
    <nav th:replace="~{fragments :: nav}"></nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card password-card">
                    <div class="card-header password-card-header text-center py-3">
                        <h4 class="m-0 fw-bold">Đổi mật khẩu</h4>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <div th:if="${error}" class="alert alert-danger text-center fw-bold" role="alert"
                             th:text="${error}"></div>

                        <form th:action="@{/home/account/change-password}" method="post">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label fw-bold">Mật khẩu hiện tại</label>
                                <input id="currentPassword" name="currentPassword" type="password"
                                       class="form-control form-control-lg" autocomplete="current-password"
                                       required autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label fw-bold">Mật khẩu mới</label>
                                <input id="newPassword" name="newPassword" type="password"
                                       class="form-control form-control-lg" autocomplete="new-password"
                                       minlength="6" maxlength="72" required>
                                <div class="form-text">Mật khẩu mới phải có ít nhất 6 ký tự và khác mật khẩu hiện tại.</div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-bold">Nhập lại mật khẩu mới</label>
                                <input id="confirmPassword" name="confirmPassword" type="password"
                                       class="form-control form-control-lg" autocomplete="new-password"
                                       minlength="6" maxlength="72" required>
                            </div>

                            <div class="d-flex flex-column flex-sm-row gap-2 pt-3 border-top">
                                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Đổi mật khẩu</button>
                                <a th:href="@{/home}" class="btn btn-outline-secondary btn-lg w-100">Hủy</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/jquery4.min.js}"></script>
<script th:src="@{/js/bootstrap5.bundle.min.js}"></script>
</body>
</html>
