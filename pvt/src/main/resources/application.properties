spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pvt?createDatabaseIfNotExist=true&useSSL=false&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=minh8893
spring.jpa.hibernate.ddl-auto=update

# Snapshot nhắc việc cá nhân: đợi quét công nợ đầu ngày rồi chụp đúng một lần/ngày.
app.personal-reminder.startup-delay-ms=20000
app.personal-reminder.retry-delay-ms=60000
spring.jpa.show-sql=true
server.port=80
app.public-url=http://localhost
spring.jackson.serialization.write_dates_as_timestamps=false
spring.mvc.view.prefix=classpath:/templates/
spring.mvc.view.suffix=.html
image.folder.path=E:/IT/images
video.folder.path=E:/IT/videos
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=12h
logging.file.name=logs/pvt.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
server.tomcat.basedir=logs
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=access
server.tomcat.accesslog.prefix=pvt-access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.pattern=%{yyyy-MM-dd HH:mm:ss}t %a "%r" %s %D
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=80MB

# Google Drive / Apps Script debt alerts. Disabled by default so existing
# deployments keep working until their external application.properties opts in.
app.debt-alert.enabled=false
app.debt-alert.web-app-url=
app.debt-alert.shared-token=
app.debt-alert.connect-timeout-seconds=10
app.debt-alert.read-timeout-seconds=330
app.debt-alert.startup-delay-ms=3000
app.debt-alert.retry-delay-ms=900000
app.debt-alert.earliest-sync-hour=7
app.debt-alert.task-deadline-hour=16

# Tích hợp Hệ thống tra giá Google Apps Script. Giữ false đến khi đã cấu hình
# URL triển khai /exec và token giống Script Property PVT_PRICE_SHARED_TOKEN.
app.price-lookup.enabled=false
app.price-lookup.web-app-url=
app.price-lookup.shared-token=
app.price-lookup.connect-timeout-seconds=10
app.price-lookup.read-timeout-seconds=330

# Giao diện phản hồi dạng chat. Chỉ thay giao diện, không thay schema database.
app.response-chat.enabled=false
app.response-chat.attachment-folder-path=./response-attachments
app.response-chat.max-images-per-message=5
app.response-chat.max-image-size-bytes=10485760
app.response-chat.max-attachments-per-message=8
app.response-chat.max-attachment-size-bytes=26214400
